<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>個人開銷記錄</title>
    <meta name="viewport"
        content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://jsdelivr.net"></script>

    <style>
        ion-content {
            --color: #111827;
            --background: #f5f6f7;
        }

        ion-toolbar {
            --background: #0b214f;
            --color: #F9FAFB;
            min-height: 85px;
            display: flex;
            align-items: center;
            box-shadow: none;
        }

        ion-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            width: 100%;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .error-text {
            color: var(--ion-color-danger, #eb445a);
            font-size: 14px;
            margin: 4px 16px 12px 16px;
            font-weight: 500;
        }

        .floating-input-group {
            position: relative;
            margin: 16px 16px 0 16px;
            border-bottom: 1px solid #E5E7EB;
            background: transparent;
        }

        .floating-input-group input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            padding: 24px 0 8px 0;
            color: #111827;
        }

        .floating-input-group label {
            position: absolute;
            left: 0;
            top: 22px;
            color: #9CA3AF;
            font-size: 16px;
            transition: all 0.2s ease-all;
            pointer-events: none;
        }

        .floating-input-group input:focus~label,
        .floating-input-group input:not(:placeholder-shown)~label {
            top: 4px;
            font-size: 12px;
            color: #1A56DB;
            font-weight: 500;
        }

        .custom-sliding-item {
            margin-bottom: 12px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            display: block;
        }

        .custom-sliding-item ion-item {
            --background: transparent;
            --color: white;
            --padding-start: 12px;
            --inner-padding-end: 12px;
            --min-height: 68px;
        }

        .custom-sliding-item ion-item-options {
            border: none;
        }

        .custom-sliding-item ion-item-option {
            padding: 0;
            margin: 0;
        }

        .gold-amount-note {
            color: #FFD700 !important;
            font-size: 24px !important;
            font-weight: 900 !important;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5), 0px 0px 1px rgba(0, 0, 0, 0.8) !important;
            margin-left: 8px !important;
            letter-spacing: 0.5px !important;
        }

        /* 原生 Range 拉桿美化 */
        .native-range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #E5E7EB;
            outline: none;
            margin: 12px 0 6px 0;
        }

        .native-range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #1A56DB;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(26, 86, 219, 0.4);
        }
/* 置中加號按鈕樣式微調 */
ion-fab[horizontal="center"] {
    margin-bottom: 12px;
}

    </style>
</head>

<body class="header1">
    <ion-app>
        <ion-header>
            <ion-toolbar>
                <ion-title>個人開銷記錄</ion-title>
            </ion-toolbar>
        </ion-header>

        <ion-content class="ion-padding">
            <ion-card style="margin: 0 0 16px 0; background: #1A56DB; color: white; border-radius: 12px;">
                <ion-card-content style="padding: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <p style="margin: 0; font-size: 14px; opacity: 0.8; color: white;">目前累積總開銷</p>
                        <ion-button id="changeBudgetBtn" fill="clear" size="small"
                            style="--color: white; margin: 0; padding: 0; font-size: 13px; font-weight: normal; opacity: 0.9;">
                            每月預算: $<span id="budgetLimitDisplay">3,000</span>
                            <ion-icon name="create-outline" slot="end"
                                style="font-size: 14px; margin-left: 4px;"></ion-icon>
                        </ion-button>
                    </div>

                    <h1 style="margin: 8px 0 12px 0; font-size: 36px; font-weight: bold; color: white;">
                        $<span id="totalAmountDisplay">0</span>
                    </h1>

                    <ion-progress-bar id="budgetProgressBar" value="0"
                        style="--background: rgba(255,255,255,0.2); height: 8px; border-radius: 4px;"></ion-progress-bar>
                    <p id="budgetTip"
                        style="margin: 8px 0 0 0; font-size: 12px; opacity: 0.9; color: white; font-weight: 500;"></p>
                </ion-card-content>
            </ion-card>

            <ion-list id="recordContainer" lines="none" style="background: transparent; margin-top: 10px;"></ion-list>

            <ion-fab vertical="bottom" horizontal="center" slot="fixed">
                <ion-fab-button id="openModalBtn">
                    <ion-icon name="add"></ion-icon>
                </ion-fab-button>
            </ion-fab>

            <ion-modal id="addModal" trigger="openModalBtn" initial-breakpoint="0.6">
                <ion-content class="ion-padding">
                    <h2 style="margin-left: 16px; font-weight: bold; margin-bottom: 24px; color: #111827;">新增開銷項目</h2>

                    <div class="floating-input-group" id="expTitleItem">
                        <input type="text" id="finalTitleInput" placeholder=" " autocomplete="off"
                            name="expense-title-field">
                        <label for="finalTitleInput">項目名稱</label>
                    </div>
                    <p id="expTitleError" class="error-text"></p>

                    <!-- ✨ 超穩定 Range 金額選擇器 -->
                    <div style="margin: 16px 16px 0 16px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size: 14px; color: #6B7280; font-weight: 500;">金額</span>
                            <span style="font-size: 22px; font-weight: 800; color: #1A56DB;">$<span id="rangeAmountValue">100</span></span>
                        </div>
                        <input type="range" id="finalAmountRange" min="10" max="10000" step="10" value="100" class="native-range-slider" oninput="updateRangeValue(this.value)">
                        <div style="display: flex; justify-content: space-between; color: #9CA3AF; font-size: 12px;">
                            <span>$10</span>
                            <span>$10,000</span>
                        </div>
                    </div>
                   

                    <ion-item lines="inset" id="expCategoryItem"
                        style="--background: transparent; margin: 12px 16px 0 16px; padding: 0;">
                        <div style="display: flex; flex-direction: column; width: 100%; padding: 4px 0;">
                            <span style="font-size: 12px; color: #666; margin-bottom: 4px;">分類</span>
                            <ion-select interface="popover" placeholder="點選選擇分類"
                                style="font-size: 16px; padding: 4px 0; --padding-start: 0; color: #111827;">
                                <ion-select-option value="餐飲">🍔 餐飲食品</ion-select-option>
                                <ion-select-option value="交通">🚗 交通出行</ion-select-option>
                                <ion-select-option value="購物">🛒 購物消費</ion-select-option>
                                <ion-select-option value="娛樂">🎮 娛樂消遣</ion-select-option>
                                <ion-select-option value="居家">🏠 居家水電</ion-select-option>
                                <ion-select-option value="其他">🪙 其他開銷</ion-select-option>
                            </ion-select>
                        </div>
                    </ion-item>
                    <div style="height: 24px;"></div>

                    <ion-button id="confirmAddBtn" expand="block" color="success" style="margin-inline: 16px;">確認新增</ion-button>
                    <ion-button id="cancelBtn" expand="block" color="danger"
                        style="margin-inline: 16px;">取消</ion-button>
                </ion-content>
            </ion-modal>

        </ion-content>
    </ion-app>

    <script>
        let records = [];
        let budgetLimit = 3000;

        const addModal = document.getElementById('addModal');

        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderList();

            if (addModal) {
                addModal.breakpoints = [0, 0.6, 0.9];
            }

            const changeBudgetBtn = document.getElementById('changeBudgetBtn');
            if (changeBudgetBtn) {
                changeBudgetBtn.addEventListener('click', popupChangeBudgetAlert);
            }
        });

        // 即時連動更新數字
        function updateRangeValue(val) {
            const rangeValueDisplay = document.getElementById('rangeAmountValue');
            if (rangeValueDisplay) {
                rangeValueDisplay.textContent = Number(val).toLocaleString();
            }
        }

        document.getElementById('cancelBtn').addEventListener('click', () => {
            addModal.dismiss();
            clearForm();
        });

        function saveData() {
            localStorage.setItem('records', JSON.stringify(records));
            localStorage.setItem('user_budget_limit', budgetLimit);
        }

        function loadData() {
            const savedText = localStorage.getItem('records');
            if (savedText) {
                records = JSON.parse(savedText);
            }
            const savedBudget = localStorage.getItem('user_budget_limit');
            if (savedBudget) {
                budgetLimit = Number(savedBudget);
            }
        }

        async function popupChangeBudgetAlert() {
            const alert = document.createElement('ion-alert');
            alert.header = '自訂每月預算';
            alert.message = '請輸入您每月的最高預算金額上限：';
            alert.inputs = [
                {
                    name: 'newBudget',
                    type: 'number',
                    placeholder: '例如：5000',
                    value: budgetLimit
                }
            ];
            alert.buttons = [
                { text: '取消', role: 'cancel' },
                {
                    text: '確認修改',
                    handler: (data) => {
                        const inputNum = Number(data.newBudget);
                        if (inputNum > 0 && !isNaN(inputNum)) {
                            budgetLimit = inputNum;
                            saveData();
                            renderList();
                        }
                    }
                }
            ];
            document.body.appendChild(alert);
            await alert.present();
        }

        async function confirmDelete(index) {
            const alert = document.createElement('ion-alert');
            alert.header = '確認刪除';
            alert.message = '確定要刪除這筆記錄嗎？';
            alert.buttons = [
                { text: '取消', role: 'cancel' },
                {
                    text: '確認刪除',
                    role: 'destructive',
                    handler: () => {
                        records.splice(index, 1);
                        saveData();
                        renderList();
                    }
                }
            ];
            document.body.appendChild(alert);
            await alert.present();
        }

        function validateForm() {
            let isValid = true;
            const titleValue = document.getElementById('finalTitleInput').value.trim();
            const rangeEl = document.getElementById('finalAmountRange');
            const amountValue = Number(rangeEl ? rangeEl.value : 0);

            if (titleValue === "") {
                document.getElementById('expTitleError').textContent = "項目名稱不能空白";
                isValid = false;
            } else {
                document.getElementById('expTitleError').textContent = "";
            }

            return isValid;
        }

        document.getElementById('confirmAddBtn').addEventListener('click', () => {
            if (!validateForm()) return;

            const rangeEl = document.getElementById('finalAmountRange');

            const newRecord = {
                title: document.getElementById('finalTitleInput').value.trim(),
                amount: Number(rangeEl.value),
                category: document.getElementById('expCategoryItem').querySelector('ion-select').value || "其他"
            };

            records.push(newRecord);
            saveData();
            renderList();
            addModal.dismiss();
            clearForm();
        });

        function clearForm() {
            document.getElementById('finalTitleInput').value = "";
            const rangeEl = document.getElementById('finalAmountRange');
            if (rangeEl) {
                rangeEl.value = 100;
            }
            updateRangeValue(100);
            document.getElementById('expCategoryItem').querySelector('ion-select').value = "";
            document.getElementById('expTitleError').textContent = "";
            
        }

        function createRecordHTML(item, index) {
            const iconConfig = getCategoryIcon(item.category);

            let displayCategory = escapeHtml(item.category);
            if (item.category === '餐飲') displayCategory = '🍔 餐飲食品';
            if (item.category === '交通') displayCategory = '🚗 交通出行';
            if (item.category === '購物') displayCategory = '🛒 購物消費';
            if (item.category === '娛樂') displayCategory = '🎮 娛樂消遣';
            if (item.category === '居家') displayCategory = '🏠 居家水電';
            if (item.category === '其他') displayCategory = '🪙 其他開銷';

            return `
            <ion-item-sliding class="custom-sliding-item" style="background-color: ${iconConfig.color};">
                <ion-item lines="none">
                    <div slot="start" style="
                        background-color: rgba(255, 255, 255, 0.9); 
                        width: 44px; 
                        height: 44px; 
                        border-radius: 50%; 
                        display: flex; 
                        align-items: center; 
                        justify-content: center;
                        margin-right: 8px;
                        font-size: 24px;
                    ">
                        ${iconConfig.emoji}
                    </div>

                    <ion-label style="margin-left: 4px;">
                        <h2 style="color: white; font-size: 18px; margin-bottom: 4px;"><strong>${escapeHtml(item.title)}</strong></h2>
                        <p style="margin: 0;">
                            <span style="background: rgba(255,255,255,0.25); color: white; font-weight: 600; padding: 3px 8px; border-radius: 6px; font-size: 12px;">
                                ${displayCategory}
                            </span>
                        </p>
                    </ion-label>

                    <ion-note slot="end" class="gold-amount-note">
                        $${item.amount}
                    </ion-note>
                </ion-item>
                
                <ion-item-options side="end">
                    <ion-item-option color="danger" onclick="confirmDelete(${index})" style="width: 70px;">
                        <ion-icon name="trash-outline" slot="icon-only" style="font-size: 22px;"></ion-icon>
                    </ion-item-option>
                </ion-item-options>
            </ion-item-sliding>
            `;
        }

        function getCategoryIcon(category) {
            if (category === '餐飲') return { emoji: '🍔', color: '#FF7A00' };
            if (category === '交通') return { emoji: '🚗', color: '#1A56DB' };
            if (category === '購物') return { emoji: '🛒', color: '#A855F7' };
            if (category === '娛樂') return { emoji: '🎮', color: '#10B981' };
            if (category === '居家') return { emoji: '🏠', color: '#1F2937' };
            if (category === '其他') return { emoji: '🪙', color: '#6B7280' };

            return { emoji: '🪙', color: '#6B7280' };
        }

        function renderList() {
            const container = document.getElementById('recordContainer');
            const totalDisplay = document.getElementById('totalAmountDisplay');
            const progressBar = document.getElementById('budgetProgressBar');
            const budgetTip = document.getElementById('budgetTip');
            const budgetLimitDisplay = document.getElementById('budgetLimitDisplay');

            if (budgetLimitDisplay) {
                budgetLimitDisplay.textContent = budgetLimit.toLocaleString();
            }

            let totalSum = 0;
            records.forEach(item => {
                totalSum += Number(item.amount || 0);
            });

            if (totalDisplay) {
                totalDisplay.textContent = totalSum.toLocaleString();
            }

            if (progressBar && budgetTip) {
                let progressRatio = totalSum / budgetLimit;

                progressBar.value = progressRatio > 1 ? 1 : progressRatio;

                if (progressRatio >= 1) {
                    progressBar.color = 'danger';
                    let overPay = totalSum - budgetLimit;
                    budgetTip.textContent = `⚠️ 您已超支 $${overPay.toLocaleString()}！請克制一下！`;
                    budgetTip.style.color = '#ff4d4d';
                } else if (progressRatio >= 0.8) {
                    progressBar.color = 'warning';
                    let remain = budgetLimit - totalSum;
                    budgetTip.textContent = `🔔 預算快用完了！僅剩 $${remain.toLocaleString()}，請注意開銷。`;
                    budgetTip.style.color = '#ffcc00';
                } else {
                    progressBar.color = 'success';
                    let remain = budgetLimit - totalSum;
                    budgetTip.textContent = `💡 剩餘可用預算：$${remain.toLocaleString()}，保持得很好！`;
                    budgetTip.style.color = '#ffffff';
                }
            }

            if (records.length === 0) {
                container.innerHTML = `
                <ion-item lines="none">
                    <ion-label class="ion-text-center" style="color: #666; padding: 20px 0;">
                    目前沒有記錄，點擊右下角按鈕開始新增
                    </ion-label>
                </ion-item>
                `;
                return;
            }

            container.innerHTML = records.map((item, index) => createRecordHTML(item, index)).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>

</html>
